<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Deer head — geometric polygonal line art -->
  <g stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left antler: main branch + fork -->
    <path d="M72 58 L58 18"/>
    <path d="M72 58 L82 28"/>
    <path d="M64 38 L50 32"/>
    <!-- Right antler: main branch + fork -->
    <path d="M128 58 L142 18"/>
    <path d="M128 58 L118 28"/>
    <path d="M136 38 L150 32"/>
    <!-- Left ear: V-shape -->
    <path d="M72 58 L52 68 L68 80"/>
    <!-- Right ear: V-shape -->
    <path d="M128 58 L148 68 L132 80"/>
    <!-- Head outline: forehead → cheek → jaw → chin → jaw → cheek → forehead -->
    <path d="M72 58 L68 80 L78 100 L100 112 L122 100 L132 80 L128 58"/>
    <!-- Internal face facets -->
    <path d="M68 80 L100 90 L132 80"/>
    <path d="M78 100 L100 90 L122 100"/>
    <path d="M100 90 L100 112"/>
    <!-- Eyes — small dark dots -->
    <circle cx="84" cy="78" r="2.5" fill="#c4b5fd" stroke="none"/>
    <circle cx="116" cy="78" r="2.5" fill="#c4b5fd" stroke="none"/>
    <!-- Nose — small downward chevron -->
    <path d="M95 98 L100 104 L105 98"/>
  </g>
  <!-- Leaf — bright neon green, growing from between antlers -->
  <path
    d="M100 20 C92 10 82 6 82 6 C82 6 86 18 100 26 C114 18 118 6 118 6 C118 6 108 10 100 20Z"
    fill="#39FF14"
    stroke="#2bcc0f"
    stroke-width="0.5"
  />
  <!-- Leaf veins -->
  <path d="M100 8 L100 24" stroke="#1a8a0a" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M100 13 L92 9" stroke="#1a8a0a" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M100 17 L108 13" stroke="#1a8a0a" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M100 20 L94 17" stroke="#1a8a0a" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M100 20 L106 17" stroke="#1a8a0a" stroke-width="0.7" stroke-linecap="round"/>
</svg>
